# Native libraries shipped in the g0v0.Framework package: the image codec library for every platform, and the
# Windows x64 recording libraries. Called by CI and release; the release job downloads the uploaded artifacts by name.
name: Build native libraries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-codecs:
    name: image-codecs (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-2022 }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: linux-arm64, os: ubuntu-22.04-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compile
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          cmake -S native/image-codecs -B native/artifacts/obj/image-codecs-${{ matrix.rid }} -DCMAKE_BUILD_TYPE=Release
          cmake --build native/artifacts/obj/image-codecs-${{ matrix.rid }} --config Release --parallel
          cmake --install native/artifacts/obj/image-codecs-${{ matrix.rid }} --config Release --prefix native/artifacts/${{ matrix.rid }}/image-codecs

      - name: Upload library and licences
        uses: actions/upload-artifact@v7
        with:
          name: image-codecs-${{ matrix.rid }}
          path: native/artifacts/${{ matrix.rid }}/image-codecs
          if-no-files-found: error

  image-codecs-android:
    name: image-codecs (android-arm64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The NDK links the C++ runtime statically (c++_static), so the library has no libc++_shared.so dependency.
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native/image-codecs -B native/artifacts/obj/image-codecs-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build native/artifacts/obj/image-codecs-android-arm64 --parallel
          cmake --install native/artifacts/obj/image-codecs-android-arm64 --prefix native/artifacts/android-arm64/image-codecs

      - name: Upload library and licences
        uses: actions/upload-artifact@v7
        with:
          name: image-codecs-android-arm64
          path: native/artifacts/android-arm64/image-codecs
          if-no-files-found: error

  image-codecs-ios:
    name: image-codecs (ios)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Devices and Apple silicon simulators (arm64). Each slice is a dynamic framework; xcodebuild combines them into an xcframework.
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          for sdk in iphoneos iphonesimulator; do
            cmake -S native/image-codecs -B "native/artifacts/obj/image-codecs-$sdk" \
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_SYSTEM_PROCESSOR=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_BUILD_TYPE=Release
            cmake --build "native/artifacts/obj/image-codecs-$sdk" --parallel
            cmake --install "native/artifacts/obj/image-codecs-$sdk" --prefix "native/artifacts/obj/install-$sdk"
          done
          mkdir -p native/artifacts/ios/image-codecs
          xcodebuild -create-xcframework \
            -framework native/artifacts/obj/install-iphoneos/g0v0-image-codecs.framework \
            -framework native/artifacts/obj/install-iphonesimulator/g0v0-image-codecs.framework \
            -output native/artifacts/ios/image-codecs/g0v0-image-codecs.xcframework
          cp -R native/artifacts/obj/install-iphoneos/licences native/artifacts/ios/image-codecs/

      - name: Upload library and licences
        uses: actions/upload-artifact@v7
        with:
          name: image-codecs-ios
          path: native/artifacts/ios/image-codecs
          if-no-files-found: error

  recording:
    name: recording (win-x64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache pinned toolchain
        uses: actions/cache@v5
        with:
          path: native/.toolchain
          key: recording-native-win-x64-${{ hashFiles('native/recording-toolchain.json') }}
      - name: Compile libraries only
        shell: pwsh
        run: ./native/build-recording.ps1 -DownloadToolchain
      - name: Assemble native packaging inspection artifact
        shell: pwsh
        run: |
          $project = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <PackageId>Recording.Native.Packaging.Check</PackageId>
              <EnableDefaultItems>false</EnableDefaultItems>
              <PackRecordingNative>true</PackRecordingNative>
              <NoPackageAnalysis>true</NoPackageAnalysis>
            </PropertyGroup>
            <Import Project="../RecordingNative.targets" />
          </Project>
          '@
          New-Item -ItemType Directory -Force native/artifacts/package-check | Out-Null
          Set-Content native/artifacts/Packaging.csproj $project -Encoding utf8
          dotnet pack native/artifacts/Packaging.csproj -c Release -o native/artifacts/package-check
          if ($LASTEXITCODE -ne 0) { throw 'Native packaging failed.' }
          $package = (Get-ChildItem native/artifacts/package-check/*.nupkg).FullName
          python native/verify-recording-package.py $package native/artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Native package inspection failed.' }
      - name: Upload libraries and checksums
        uses: actions/upload-artifact@v7
        with:
          name: recording-native-win-x64
          path: |
            native/artifacts/win-x64/*.dll
            native/artifacts/win-x64/SHA256SUMS
          if-no-files-found: error
